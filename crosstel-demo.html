<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosstel — Live Demo</title>
<style>
  :root{
    --paper:#FAF7F1;
    --ink:#2E2A22;
    --muted:#8D8471;
    --gold:#C9A227;
    --gold-hi:#F2D87E;
    --gold-lo:#9C7A15;
    --teal:#2FBDB3;
    --pink:#F19EC7;
    --line:#3A352C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;
    overflow-x:hidden;
  }
  header{
    text-align:center;
    padding:34px 20px 6px;
  }
  header h1{
    font-size:clamp(30px,6vw,46px);
    font-weight:700;
    letter-spacing:.42em;
    margin-right:-.42em; /* balance tracking */
  }
  header p{
    margin-top:8px;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.14em;
  }
  .stage{
    width:min(920px,96vw);
    position:relative;
    user-select:none;
  }
  svg{width:100%;height:auto;display:block}

  /* floating idle motion */
  #shoe{
    animation:float 5.5s ease-in-out infinite;
    transform-origin:50% 60%;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  @media (prefers-reduced-motion: reduce){
    #shoe{animation:none}
    *{transition-duration:.01ms !important}
  }

  /* part groups: transitions for explode + cinch */
  #g-sole,#g-tongue,#g-collar,#g-fin,#g-throat,#g-toecap,#g-brandtxt{
    transition:transform .8s cubic-bezier(.34,1.3,.4,1);
  }
  .exploded #g-sole{transform:translate(0,95px)}
  .exploded #g-tongue{transform:translate(-14px,-84px)}
  .exploded #g-collar{transform:translate(10px,-52px)}
  .exploded #g-fin{transform:translate(66px,-8px)}
  .exploded #g-throat{transform:translate(-34px,-28px)}
  .exploded #g-toecap{transform:translate(-52px,6px)}
  .exploded #g-brandtxt{opacity:0}

  .lace-under,.lace-over{transition:stroke-width .6s ease}
  .cinched .lace-under{stroke-width:22}
  .cinched .lace-over{stroke-width:13}
  #dial-rotor{transition:transform .8s cubic-bezier(.4,0,.2,1);transform-origin:1282px 764px}
  .cinched #dial-rotor{transform:rotate(200deg)}
  #cinch-ring{opacity:0;transform-origin:1282px 764px}
  .cinched #cinch-ring{animation:ring .9s ease-out 1}
  @keyframes ring{
    0%{opacity:.9;transform:scale(.4)}
    100%{opacity:0;transform:scale(2.1)}
  }

  /* accent-recolorable pieces */
  .acc-stripe{transition:stroke .5s ease}
  .acc-wrap{transition:fill .5s ease}

  /* hotspots */
  .hotspot{cursor:pointer}
  .hotspot circle.core{fill:var(--ink)}
  .hotspot circle.halo{
    fill:none;stroke:var(--ink);stroke-width:2;opacity:.5;
    animation:halo 2.4s ease-out infinite;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes halo{
    0%{transform:scale(.6);opacity:.6}
    70%{transform:scale(1.8);opacity:0}
    100%{opacity:0}
  }
  .hotspot.active circle.core{fill:var(--gold-lo)}

  /* panel */
  .panel{
    width:min(920px,96vw);
    display:flex;
    gap:18px;
    padding:6px 4px 40px;
    flex-wrap:wrap;
    align-items:stretch;
  }
  .card{
    flex:1 1 300px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    padding:18px 20px;
    min-height:118px;
  }
  .card h2{font-size:17px;letter-spacing:.04em;margin-bottom:6px}
  .card p{font-size:14.5px;line-height:1.5;color:#55503f}
  .controls{
    flex:0 1 300px;
    display:flex;flex-direction:column;gap:10px;justify-content:center;
  }
  button{
    font:inherit;font-size:14.5px;font-weight:600;
    padding:11px 16px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:#fff;color:var(--ink);
    cursor:pointer;
    transition:background .2s ease,color .2s ease,transform .1s ease;
  }
  button:hover{background:var(--ink);color:#fff}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  button.on{background:var(--gold);border-color:var(--gold-lo);color:#fff}
  .swatches{display:flex;gap:10px;align-items:center}
  .swatches span{font-size:13px;color:var(--muted);letter-spacing:.06em}
  .sw{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--ink);cursor:pointer;padding:0;
  }
  .sw:hover{transform:scale(1.1);background:inherit}
  .sw.gold{background:linear-gradient(160deg,var(--gold-hi),var(--gold-lo))}
  .sw.teal{background:linear-gradient(160deg,#7fe3db,#1e8f88)}
  .sw.pink{background:linear-gradient(160deg,#f9c2da,#e26fa9)}
  .sw.sel{outline:3px solid var(--ink);outline-offset:2px}
  .back-link{
    position:fixed;top:18px;left:18px;z-index:10;
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;letter-spacing:.03em;
    color:var(--ink);text-decoration:none;
    padding:8px 14px;border-radius:999px;
    background:#fff;border:2px solid var(--ink);
    transition:background .2s ease,color .2s ease;
  }
  .back-link:hover{background:var(--ink);color:#fff}
</style>
</head>
<body>

<a href="index.html#projects" class="back-link">← Back to Portfolio</a>

<div class="panel">
  <div class="card" id="feature-card" aria-live="polite">
    <h2 id="fc-title">Let your toes tell your mind a comfort story — for once</h2>
    <p id="fc-body">Poke the glowing dots, give the dial a twist, or pull the whole shoe apart. Go ahead — it doesn't mind.</p>
  </div>
  <div class="controls">
    <button id="btn-cinch">Twist dial to cinch fit</button>
    <button id="btn-explode">Pull apart the build</button>
    <div class="swatches">
      <span>Accent</span>
      <button class="sw teal sel" data-acc="teal" aria-label="Teal accent"></button>
      <button class="sw gold" data-acc="gold" aria-label="Gold accent"></button>
      <button class="sw pink" data-acc="pink" aria-label="Pink accent"></button>
    </div>
  </div>
</div>

<script>
  const svg = document.getElementById('shoe-svg');
  const fcT = document.getElementById('fc-title');
  const fcB = document.getElementById('fc-body');

  const FEATURES = {
    toe:    ["Composite toe cap", "A carbon-blend cap moulded thin to the foot's shape. Steel-grade impact protection at roughly half the weight, with no cold transfer in winter."],
    knit:   ["Water-shedding knit", "Engineered mesh with a water-repellent coating and a bonded membrane behind it. Breathable across the wide forefoot, dry in a wet loading bay."],
    tongue: ["Hidden tongue print", "A pink iridescent print on the inner face of the tongue — visible only when the laces are loosened. Yours to personalise."],
    collar: ["Asymmetric collar", "Padded gold collar cut higher on the outside for ankle support, scooped lower on the inside so your ankles never rub."],
    dial:   ["Heel fin + dial", "The sculpted gold fin doubles as a pull tab and houses the micro-adjust dial. One twist cinches the whole shoe — glove-friendly, nothing to re-tie."],
    sole:   ["Translucent fan-tread sole", "Milky vulcanised rubber with suspended gold and teal flecks. The fan tread radiates from the ball of the foot for grip on gym floors and wet concrete."]
  };

  // hotspots
  let activeSpot = null;
  document.querySelectorAll('.hotspot').forEach(h => {
    const show = () => {
      const [t, b] = FEATURES[h.dataset.f];
      fcT.textContent = t;
      fcB.textContent = b;
      if (activeSpot) activeSpot.classList.remove('active');
      h.classList.add('active');
      activeSpot = h;
    };
    h.addEventListener('click', show);
    h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(); } });
  });

  // cinch
  const btnCinch = document.getElementById('btn-cinch');
  btnCinch.addEventListener('click', () => {
    const on = svg.classList.toggle('cinched');
    btnCinch.classList.toggle('on', on);
    btnCinch.textContent = on ? 'Fit locked — twist to release' : 'Twist dial to cinch fit';
    fcT.textContent = on ? 'Fit locked' : 'Fit released';
    fcB.textContent = on
      ? 'The wire pulls the collar and midfoot snug in one even motion. The front laces are purely decorative.'
      : 'One twist backwards and the tension releases. Adjust mid-lift or mid-shift with one gloved hand.';
  });

  // explode
  const btnExp = document.getElementById('btn-explode');
  btnExp.addEventListener('click', () => {
    const on = svg.classList.toggle('exploded');
    btnExp.classList.toggle('on', on);
    btnExp.textContent = on ? 'Put it back together' : 'Pull apart the build';
    fcT.textContent = on ? 'The build, layer by layer' : 'Back in one piece';
    fcB.textContent = on
      ? 'Composite cap, laced throat, pink-printed tongue, asymmetric collar, dial-bearing heel fin — all seated on the translucent fan-tread sole.'
      : 'Every layer seats back onto the sole unit. Tap the dots to keep exploring.';
  });

  // accent swap
  const ACC = {
    teal: { stripe:'#2fbdb3', wrap:'#eccf7a' },
    gold: { stripe:'#c9a227', wrap:'#f2d87e' },
    pink: { stripe:'#f19ec7', wrap:'#f6d9e8' }
  };
  const stripe = document.getElementById('stripe');
  const wrap = document.getElementById('wrap');
  const flecks = document.getElementById('flecks').querySelectorAll('circle');
  document.querySelectorAll('.sw').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.sw').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      const a = ACC[b.dataset.acc];
      stripe.setAttribute('stroke', a.stripe);
      wrap.setAttribute('fill', a.wrap);
      flecks.forEach((c, i) => {
        if (i % 2 === 1) c.setAttribute('fill', a.stripe);
      });
      fcT.textContent = 'Accent: ' + b.dataset.acc;
      fcB.textContent = 'The pinstripe, sole flecks and midfoot wrap take the new accent. White and gold stay the backbone of the colourway.';
    });
  });
</script>
</body>
</html>
