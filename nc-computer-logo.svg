<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="NC-Developer LLC">
  <defs>
    <linearGradient id="cg-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7A5C1E"/>
      <stop offset="28%"  stop-color="#C8A44A"/>
      <stop offset="52%"  stop-color="#F0D88A"/>
      <stop offset="76%"  stop-color="#C8A44A"/>
      <stop offset="100%" stop-color="#7A5C1E"/>
    </linearGradient>
    <linearGradient id="cg-stand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#9A7A2E"/>
    </linearGradient>
    <linearGradient id="cg-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B1F18"/>
      <stop offset="100%" stop-color="#0F2E24"/>
    </linearGradient>
    <linearGradient id="cg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3DDAC5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1EBFA0" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="cg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#C8A44A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Monitor bezel -->
  <rect x="6" y="8" width="108" height="76" rx="9" fill="url(#cg-body)" filter="url(#cg-shadow)"/>

  <!-- Bezel top highlight -->
  <rect x="6" y="8" width="108" height="10" rx="9" fill="rgba(255,255,255,0.14)"/>

  <!-- Screen -->
  <rect x="13" y="15" width="94" height="62" rx="5" fill="url(#cg-screen)"/>

  <!-- Screen teal glow overlay -->
  <rect x="13" y="15" width="94" height="62" rx="5" fill="url(#cg-glow)"/>

  <!-- Screen glare -->
  <rect x="16" y="18" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.18)"/>

  <!-- Code lines on screen -->
  <rect x="22" y="32" width="50" height="3.5" rx="1.75" fill="rgba(255,255,255,0.30)"/>
  <rect x="22" y="41" width="36" height="3.5" rx="1.75" fill="rgba(255,255,255,0.20)"/>
  <rect x="22" y="50" width="58" height="3.5" rx="1.75" fill="rgba(255,255,255,0.30)"/>
  <rect x="22" y="59" width="30" height="3.5" rx="1.75" fill="rgba(255,255,255,0.20)"/>

  <!-- Teal cursor blink -->
  <rect x="56" y="59" width="7" height="3.5" rx="1.75" fill="#3DDAC5"/>

  <!-- "NC" text watermark on screen -->
  <text x="83" y="70" font-family="serif" font-size="13" font-weight="700"
        fill="rgba(200,164,74,0.45)" letter-spacing="1">NC</text>

  <!-- Stand post -->
  <rect x="51" y="84" width="18" height="13" rx="3" fill="url(#cg-stand)"/>

  <!-- Base -->
  <rect x="31" y="97" width="58" height="9" rx="4.5" fill="url(#cg-body)"/>

  <!-- Base top highlight -->
  <rect x="31" y="97" width="58" height="3" rx="4.5" fill="rgba(255,255,255,0.12)"/>
</svg>
